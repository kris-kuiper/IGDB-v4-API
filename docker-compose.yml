services:

  igdbv4:
    container_name: igdbv4
    build: ./.build
    restart: "no"
    # Keep the CLI container alive so `docker compose exec` works (tests, PHPStan, PHPCS, git hooks).
    command: tail -f /dev/null
    volumes:
      - webroot:/var/www

volumes:
  webroot:
    driver: local
    driver_opts:
      type: none
      device: "${APP_ROOT_DIRECTORY}"
      o: bind